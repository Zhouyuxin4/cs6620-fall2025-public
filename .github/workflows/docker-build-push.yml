name: Docker Build, Push, and Deploy

on:
  push:
    branches:
      - week02

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

  deploy:
    name: Deploy to EC2 via AWS SSM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}  # Learner Lab 必须
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy application to EC2
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Automated deployment from GitHub Actions" \
            --parameters 'commands=[
              "sudo docker stop cs6620-app || true",
              "sudo docker rm cs6620-app || true",
              "sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
              "sudo docker run -d -p 80:5000 --restart unless-stopped --name cs6620-app ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest"
            ]'

      - name: Confirm deployment command sent
        run: echo "Deployment command sent successfully via SSM!"

